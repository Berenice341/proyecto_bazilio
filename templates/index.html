<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bazilio (ANTLR4)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bazilio (ANTLR4)</h2>
        <textarea id="codigoMusical">E4 E4 F4 G4 F4 E4 D4 C4 C4 D4 E4 E4 D4 D4</textarea>
        <br>
        <button onclick="enviarYReproducir()">Reproducir</button>
        <p id="estado"></p>
    </div>

    <script>
        // Función principal para conectar con Flask y reproducir el audio de forma suave
        async function enviarYReproducir() {
            const codigo = document.getElementById('codigoMusical').value;
            const estado = document.getElementById('estado');
            estado.innerText = "Procesando...";

            try {
                // Envía el texto a tu ruta de Flask para que ANTLR4 lo procese
                const response = await fetch('/parse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: codigo })
                });

                const data = await response.json();

                if (data.success) {
                    estado.innerText = "Reproduciendo...";
                    // data.events debe contener las frecuencias o notas calculadas por tu backend
                    reproducirSecuenciaSuave(data.events);
                } else {
                    estado.innerText = "Error en la gramática.";
                }
            } catch (error) {
                console.error("Error:", error);
                estado.innerText = "Error de conexión.";
            }
        }

        // Sintetizador con Web Audio API optimizado (sin clics, envolvente suave y tono cálido)
        function reproducirSecuenciaSuave(eventos) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();

            let tiempoActual = audioCtx.currentTime;
            const duracionNota = 0.4;  // Duración de cada nota
            const pausaEntreNotas = 0.1; // Pequeña separación fluida

            eventos.forEach((frecuencia, index) => {
                const inicio = tiempoActual + (index * (duracionNota + pausaEntreNotas));

                // 1. Crear Oscilador ('triangle' da un sonido más cálido tipo instrumento)
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(frecuencia, inicio);

                // 2. Nodo de Ganancia para controlar volumen (Ataque y Release)
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, inicio);
                
                // ATAQUE: Sube suavemente en 20 ms para evitar el "clic" seco inicial
                gainNode.gain.linearRampToValueAtTime(0.4, inicio + 0.02);

                // 3. Filtro pasa-bajos opcional para un sonido más dulce y menos metálico
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2000, inicio);

                // 4. Conexiones
                oscillator.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                // 5. Iniciar y detener el oscilador con una caída (*release*) suave
                oscillator.start(inicio);
                
                gainNode.gain.setValueAtTime(0.4, inicio + duracionNota);
                // RELEASE: Baja el volumen gradualmente al terminar la nota
                gainNode.gain.linearRampToValueAtTime(0, inicio + duracionNota + 0.1);

                oscillator.stop(inicio + duracionNota + 0.1);
            });

            // Restablecer estado cuando termine la reproducción total
            setTimeout(() => {
                document.getElementById('estado').innerText = "¡Listo!";
            }, (eventos.length * (duracionNota + pausaEntreNotas)) * 1000);
        }
    </script>
</body>
</html>
